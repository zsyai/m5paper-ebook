[platformio]
default_envs = m5paper

[env:m5paper]
platform = espressif32@6.10.0
board = m5stack-fire
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default_16MB.csv
; QIO / 80 MHz flash: the bootloader loads and checks the app image ~0.3 s
; faster, which shortens the wheel press needed to power on.
board_build.flash_mode = qio
board_build.f_flash = 80000000L
; Built-in UI font (GB2312 + ASCII + the Latin letters and punctuation of
; tools/add_latin_glyphs.py, 30px, tools/ttf2bin.py format v3).
board_build.embed_files = assets/ui_font_30.bin
; Web page of the Wi-Fi file transfer page, embedded as a C string.
board_build.embed_txtfiles = assets/transfer_client.html
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps = 
    m5stack/M5Unified@0.2.23
    m5stack/M5GFX@0.2.30
    ; FreeType 2.4 (TrueType + smooth renderer) for TTF body fonts.
    https://github.com/takkaO/OpenFontRender.git#v1.2

; Boot / file-open profiling build. Prints [PERF] lines on Serial and waits
; for each e-ink refresh so timings include the panel update.
;   pio device list                       # find the M5Paper port
;   pio device monitor -e m5paper_perf -p <port>
; The log2file filter saves the session to logs/device-monitor-*.log in
; the project dir; summarize it with tools/perf_report.py.
[env:m5paper_perf]
extends = env:m5paper
monitor_filters = time, log2file
build_flags =
    -DCORE_DEBUG_LEVEL=4
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DREADER_PERF=1
